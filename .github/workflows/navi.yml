# 博物館イベントナビの定期実行（時刻はすべて日本時間）
#   公式サイトの巡回 … 火・金 4:00
#   Instagram        … 毎日 1:00（Metaの上限のため1回400件まで。残りは翌日）
#   元ページとの照合・自治体オープンデータ … 日曜 3:00
#   設備・休館日の調べ直し … 毎月1日 2:00
#   AIの残り作業（種類の判定・題名の作り直し）… 毎日 13:00（夜の実行で無料枠を使い切った分の続き）
# 巡回の状態（名簿を含む）は暗号化して、リリース「state」の添付ファイルとして保存する（リポジトリには入れない）
name: navi
on:
  schedule:
    - cron: "0 19 * * 1,4"
    - cron: "0 16 * * *"
    - cron: "0 18 * * 6"
    - cron: "0 17 1 * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "実行する作業"
        type: choice
        options: [site, instagram, verify, amenities, llm, export]
        default: instagram
permissions:
  contents: write
# 状態ファイルを同時に書き換えないよう、1本ずつ順に動かす
concurrency:
  group: navi-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crawler/package-lock.json
      - name: 作業を決める
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "0 19 * * 1,4") t=site ;;
            "0 16 * * *") t=instagram ;;
            "0 18 * * 6") t=verify ;;
            "0 17 1 * *") t=amenities ;;
            "0 4 * * *") t=llm ;;
            *) t="${{ inputs.task }}" ;;
          esac
          echo "name=$t" >> "$GITHUB_OUTPUT"
      - name: 状態を復元
        run: gh release download state -p state.enc -D . && bash scripts/state.sh unpack
      - run: npm ci
        working-directory: crawler
      - name: 実行
        working-directory: crawler
        run: |
          case "${{ steps.task.outputs.name }}" in
            site) npx tsx src/crawl.ts --concurrency 16 && npx tsx src/structure.ts && npx tsx src/classify-llm.ts && npx tsx src/repair-titles.ts ;;
            instagram) npx tsx src/instagram.ts --limit 600 --max-minutes 290 && npx tsx src/classify-llm.ts ;;
            verify) npx tsx src/verify.ts --concurrency 14 && npx tsx src/opendata.ts ;;
            amenities) npx tsx src/amenities.ts --only-live --concurrency 16 && npx tsx src/closed-days.ts ;;
            llm) npx tsx src/classify-llm.ts && npx tsx src/repair-titles.ts ;;
            export) echo "書き出しと公開だけを行う（動作確認用）" ;;
          esac
          npx tsx src/export.ts
      # 途中で失敗しても、そこまでの結果は保存する
      - name: 状態を暗号化して保存
        if: always()
        run: |
          [ -d data/crawl ] || exit 0
          bash scripts/state.sh pack
          gh release upload state state.enc --clobber
      - name: サイトに反映
        working-directory: site
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # 長い実行の途中でサイトのコードが直されることがあるので、data 以外は公開直前の最新に合わせる
        run: |
          git fetch -q --depth 1 origin main
          git restore --source=FETCH_HEAD --worktree -- . ':(exclude)data'
          npx --yes vercel@63.1.2 --prod --yes --scope hirabayashi-5135s-projects --token "${{ secrets.VERCEL_TOKEN }}"
